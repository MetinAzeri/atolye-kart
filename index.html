<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilhane Atölye — El Yapımı Seramik</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18",
    "react-dom": "https://esm.sh/react-dom@18",
    "react-dom/client": "https://esm.sh/react-dom@18/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6?external=react,react-dom"
  }
}
</script>
<style>
  :root {
    --accent: #b5551f;
    --accent-dark: #8a3f16;
    --text-primary: #3d2b1f;
    --text-secondary: #7a6a5c;
    --border: #e6d9c9;
    --bg: #f6efe4;
    --card-bg: #fffaf2;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    padding: 48px 24px;
  }

  .page {
    max-width: 960px;
    margin: 0 auto;
  }

  .navbar {
    max-width: 960px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .navbar-logo {
    display: block;
    height: 48px;
    width: auto;
    flex-shrink: 0;
  }

  .navbar-links {
    display: flex;
    align-items: center;
    gap: 24px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-link {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    text-decoration: none;
  }

  .nav-link:hover {
    color: var(--text-primary);
  }

  .nav-link--active {
    color: var(--accent);
  }

  .navbar-cart {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .navbar-cart-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  @media (max-width: 720px) {
    .navbar {
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }

    .navbar-links {
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 48px;
  }

  .header-text {
    text-align: left;
  }

  .workshop-logo {
    display: block;
    height: 90px;
    width: auto;
  }

  .tagline {
    margin: 12px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--text-secondary);
  }

  .qr-code {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .qr-code-label {
    margin: 0;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .about-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    margin-bottom: 56px;
  }

  .about-title {
    margin: 0 0 16px;
    font-size: 26px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.3px;
  }

  .about-text {
    margin: 0;
    max-width: 52ch;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-secondary);
  }

  .about-gallery {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    grid-template-rows: repeat(2, 140px);
    gap: 12px;
  }

  .about-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(61, 43, 31, 0.08);
  }

  .about-gallery img:first-child {
    grid-row: 1 / 3;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(61, 43, 31, 0.08);
    padding: 28px 24px;
    text-align: center;
    transition: opacity 0.15s ease;
  }

  .product-card--out-of-stock {
    opacity: 0.6;
  }

  .product-image {
    position: relative;
    width: 100%;
    height: 140px;
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    cursor: pointer;
  }

  .product-image-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.2s ease;
  }

  .product-category {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #fff;
  }

  .product-name {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .product-price {
    margin: 6px 0 16px;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent-dark);
  }

  .product-description {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .product-stock {
    display: inline-block;
    margin-top: 16px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .product-stock--in-stock {
    background: #e3ede4;
    color: #3f6b4a;
  }

  .product-stock--low-stock {
    background: #f5e6d3;
    color: #a5661e;
  }

  .product-stock--out-of-stock {
    background: #f2ded9;
    color: #a13f2c;
  }

  .card-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .card-hint {
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .card-button {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .card-button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .card-button--secondary {
    background: transparent;
    color: var(--accent-dark);
  }

  .card-form {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }

  .card-form-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: #fff;
  }

  .card-form-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .card-form-actions {
    display: flex;
    gap: 10px;
  }

  .card-form-actions .card-button {
    flex: 1;
  }

  .card-form-message {
    margin: 16px 0 0;
    font-size: 13px;
  }

  .card-form-message--success {
    color: #3f6b4a;
  }

  .card-form-message--error {
    margin: 0;
    color: #a13f2c;
  }

  @media (max-width: 720px) {
    .products {
      grid-template-columns: 1fr;
    }

    .header {
      flex-direction: column;
      text-align: center;
    }

    .header-text {
      text-align: center;
    }

    .workshop-logo {
      height: 70px;
      margin: 0 auto;
    }

    .about-section {
      grid-template-columns: 1fr;
      gap: 24px;
      text-align: center;
    }

    .about-text {
      max-width: none;
      margin: 0 auto;
    }

    .about-gallery {
      grid-template-columns: 1fr;
      grid-template-rows: none;
    }

    .about-gallery img {
      height: 220px;
    }

    .about-gallery img:first-child {
      grid-row: auto;
    }
  }
</style>
</head>
<body>

  <div id="root"></div>

  <script type="module" src="./src/main.js"></script>

</body>
</html>
